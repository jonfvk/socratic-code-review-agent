[project]
name = "socratic-code-review-agent"
version = "0.1.0"
description = "A Socratic tutor for understanding code, powered by LangChain and a VS Code extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.9",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
